<style>
:root { --bg:#f5f3ee; --card:#fff; --ink:#25231f; --muted:#77716a; --accent:#6d7b5b; --line:#e7e2da; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
.wrap { max-width:760px; margin:auto; padding:22px 14px 50px; }
.hero { background:var(--card); border-radius:22px; padding:22px; box-shadow:0 4px 18px #0000000d; margin-bottom:14px; }
h1 { margin:0 0 6px; font-size:28px; }
.sub { color:var(--muted); margin-bottom:18px; }
.progress { height:12px; background:#ebe7df; border-radius:99px; overflow:hidden; }
.bar { height:100%; width:0; background:var(--accent); transition:.25s; }
.stats { display:flex; justify-content:space-between; margin-top:10px; color:var(--muted); font-size:14px; }
.controls { display:flex; gap:8px; margin:14px 0; }
input[type=search] { flex:1; border:1px solid var(--line); border-radius:14px; padding:12px 14px; font-size:16px; }
button { border:1px solid var(--line); background:var(--card); border-radius:14px; padding:10px 13px; font-weight:600; }
.day { display:grid; grid-template-columns:24px 42px 86px 1fr; gap:8px; align-items:center; background:var(--card); border:1px solid var(--line); padding:11px 12px; margin:6px 0; border-radius:15px; cursor:pointer; }
.day.done { opacity:.55; }
.day.done .reading { text-decoration:line-through; }
.day.today { outline:2px solid var(--accent); }
.num { font-weight:800; color:var(--accent); }
.date { color:var(--muted); font-size:13px; }
.reading { font-weight:600; }
@media(max-width:560px) {
  .day { grid-template-columns:24px 38px 74px 1fr; font-size:14px; }
  .date { font-size:12px; }
}
</style>

<script>
const checks=[...document.querySelectorAll('input[type=checkbox]')];
const bar=document.getElementById('bar'), count=document.getElementById('count'), pct=document.getElementById('pct');
const key='biblia-365-plan-v1';
let saved=JSON.parse(localStorage.getItem(key)||'{}');
function update(){
  let done=0;
  checks.forEach(c=>{
    const on=!!saved[c.dataset.day]; c.checked=on;
    c.closest('.day').classList.toggle('done',on);
    if(on) done++;
  });
  const p=Math.round(done/checks.length*100);
  bar.style.width=p+'%'; count.textContent=done+' de '+checks.length+' días'; pct.textContent=p+'%';
  localStorage.setItem(key,JSON.stringify(saved));
}
checks.forEach(c=>c.addEventListener('change',()=>{ saved[c.dataset.day]=c.checked; if(!c.checked) delete saved[c.dataset.day]; update(); }));
document.getElementById('search').addEventListener('input',e=>{
  const q=e.target.value.toLowerCase().trim();
  document.querySelectorAll('.day').forEach(x=>x.style.display=(!q || x.dataset.text.includes(q) || x.querySelector('.num').textContent===q)?'grid':'none');
});
document.getElementById('today').onclick=()=>{
  const iso=new Date().toLocaleDateString('en-CA');
  const el=document.querySelector('.day[data-date="'+iso+'"]');
  if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.classList.add('today'); setTimeout(()=>el.classList.remove('today'),2500); }
};
document.getElementById('reset').onclick=()=>{ if(confirm('¿Reiniciar todo el progreso?')){ saved={}; update(); } };
update();
</script>
